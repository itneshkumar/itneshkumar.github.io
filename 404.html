<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found · Itnesh Kumar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">

    <header class="max-w-6xl mx-auto px-8 pt-8 w-full">
        <div id="nav-root"></div>
    </header>

    <main class="flex-grow flex items-center justify-center px-8 py-24">
        <div class="text-center max-w-lg">
            <div class="text-xs font-mono text-teal-500 uppercase tracking-[0.3em] mb-6">Error 404</div>
            <h1 class="text-8xl font-bold text-slate-800 mb-6 select-none">404</h1>
            <h2 class="text-2xl font-bold text-white mb-4">Page not found</h2>
            <p class="text-slate-400 text-base leading-relaxed mb-8">This route returned a null result. The page you're looking for doesn't exist or was moved.</p>

            <div class="bg-slate-800/50 border border-slate-700 rounded-lg p-5 font-mono text-sm text-left mb-10">
                <div><span class="text-slate-500">$ </span><span class="text-teal-400">find . -name "this-page" 2&gt;&amp;1</span></div>
                <div class="mt-2 text-red-400">find: no results found in any directory</div>
                <div class="mt-2"><span class="text-slate-500">$ </span><span class="text-slate-300 opacity-60">_</span><span class="text-teal-400 typewriter-cursor">▌</span></div>
            </div>

            <a href="/" class="cta-btn-primary">← Back to Home</a>
        </div>
    </main>

    <div id="footer-root"></div>
    <script src="/nav.js"></script>
</body>
</html>
